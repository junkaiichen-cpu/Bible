name: Build Bible Fighter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bible-fighter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Validate source and runtime contract
        run: npm run validate
      - name: Build Windows portable executable
        run: npx electron-builder --win portable --publish never
      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path dist -Filter *.exe)
          if ($files.Count -lt 1) { Write-Error 'No Windows .exe was produced.' }
          $expected = Join-Path (Get-Location) 'dist\Bible-Fighter-Windows-x64.exe'
          if (-not (Test-Path $expected)) { Write-Error "Stable Windows asset missing: $expected" }
          foreach ($file in $files) {
            if ($file.Length -lt 10000000) { Write-Error "Windows artifact is unexpectedly small: $($file.Name) ($($file.Length) bytes)" }
            Write-Host "Verified $($file.FullName) ($($file.Length) bytes)"
          }
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bible-fighter-windows-x64-build
          path: dist/Bible-Fighter-Windows-x64.exe
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'dist\Bible-Fighter-Windows-x64.exe'
          $env:BIBLE_FIGHTER_SMOKE = '1'
          $process = Start-Process -FilePath $exe -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            Write-Error 'Packaged Bible Fighter did not exit from smoke test within 60 seconds.'
          }
          if ($process.ExitCode -ne 0) { Write-Error "Packaged Bible Fighter smoke test failed with exit code $($process.ExitCode)." }
          Write-Host 'Packaged Bible Fighter smoke test passed.'
      - name: Publish smoke diagnostics
        if: always()
        shell: pwsh
        run: |
          $log = Get-ChildItem -Path $env:LOCALAPPDATA -Filter bible-fighter-runtime.log -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Copy-Item $log.FullName -Destination runtime-smoke.log -Force; Write-Host "Collected runtime log: $($log.FullName)" }
          else { "No bible-fighter-runtime.log found." | Set-Content runtime-smoke.log }
          $trace = Get-ChildItem -Path $env:LOCALAPPDATA -Filter bible-fighter-smoke.log -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($trace) { Copy-Item $trace.FullName -Destination runtime-smoke-trace.log -Force }
      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bible-fighter-windows-x64-smoke
          path: |
            runtime-smoke.log
            runtime-smoke-trace.log
          if-no-files-found: warn
          compression-level: 6
          overwrite: true
      - name: Publish Windows executable to GitHub Release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          $asset = 'dist/Bible-Fighter-Windows-x64.exe'
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $asset --clobber }
          else { gh release create $tag $asset --title "Bible Fighter $tag" --notes "Windows x64 portable build. Runtime and real-combat smoke tests passed. Download the EXE below and double-click it to play." }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Validate source and runtime contract
        run: npm run validate
      - name: Build macOS package
        run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: bible-fighter-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
